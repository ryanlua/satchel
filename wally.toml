[package]
name = "ryanlua/satchel"
description = "A modern open-source alternative to Roblox's default backpack."
version = "2.0.0"
license = "MPL-2.0"
authors = ["Ryan Luu <ryan.luu@ryanluu.dev>"]
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
homepage = "https://satchel.luau.page"
repository = "https://github.com/ryanlua/satchel"
exclude = ["**"]
include = ["LICENSE.md", "README.md", "default.project.json", "src", "src/*", "wally.toml"]

[dependencies]
react = "haedrix/react@17.3.10"
react-devtools = "haedrix/react-devtools@17.3.10"
react-globals = "haedrix/react-globals@17.3.10"
react-roblox = "haedrix/react-roblox@17.3.10"
topbarplus = "1foreverhd/topbarplus@3.5.0"
