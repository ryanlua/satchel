name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.2.1
      - name: Install Wally packages
        run: |
          wally install
          rojo sourcemap satchel.project.json --output sourcemap.json
          wally-package-types --sourcemap sourcemap.json Packages/
      - name: Check RSML output is up to date
        run: |
          rsml build src
          if [ -n "$(git status --porcelain -- src)" ]; then
            git status --short -- src
            echo "::error::Generated stylesheets are out of date. Run 'rsml build src' and commit the .model.json files."
            exit 1
          fi
      - name: Run StyLua
        run: stylua --check src/ models/
      - name: Run selene
        run: selene src/ models/
      - name: Build Rojo project
        run: |
          rojo build model.project.json --output Satchel.rbxm
          rojo build model.project.json --output Satchel.rbxmx
      - name: Archive build files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Satchel
          path: |
            *.rbxm
            *.rbxmx
          if-no-files-found: error